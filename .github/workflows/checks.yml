name: Application checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sector
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sector/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run kit:export
      - run: npm test
      # build is wrangler deploy --dry-run; no account credentials or deploy step.
      - run: npm run build
      - run: python -m pip install -r requirements-pdf.txt
      - run: python -c 'import pdfplumber, pypdfium2'
      - run: python -m unittest discover -s test -p 'test_*.py'
  macos-ocr:
    name: macOS Vision OCR (isolated)
    runs-on: macos-14
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sector
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-pdf.txt
      - run: xcrun swiftc -O scripts/pdf_ocr.swift -o "$RUNNER_TEMP/sector-pdf-ocr"
      - run: python -m unittest discover -s test -p 'test_macos_ocr.py'
        env:
          SECTOR_TEST_OCR_BINARY: ${{ runner.temp }}/sector-pdf-ocr

      - run: python -m unittest discover -s test -p 'test_buyback_image.py'
        env:
          SECTOR_TEST_OCR_BINARY: ${{ runner.temp }}/sector-pdf-ocr

  python-312:
    name: Python 3.12 compatibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sector
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sector/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r requirements-pdf.txt
      - run: python -m unittest discover -s test -p 'test_*.py'
